<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPUB 阅读器 - 书架</title>
    <link rel="stylesheet" href="/src/bookshelf.css" />
  </head>
  <body>
    <!-- 侧边栏：分类 -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="logo">📚</span>
        <span class="logo-text">我的书架</span>
      </div>
      <ul id="category-list"></ul>
      <div id="sidebar-footer">
        <button id="add-cat-btn">＋ 新建分类</button>
      </div>
    </aside>

    <!-- 主区域 -->
    <main id="main">
      <header id="top-bar">
        <h2 id="current-cat-title">全部书籍</h2>
        <span id="book-count"></span>
        <button id="add-book-btn">＋ 添加书籍</button>
      </header>

      <div id="content">
        <div id="book-grid"></div>
        <div id="empty-state">
          <div class="empty-icon">📖</div>
          <p>书架空空如也</p>
          <p class="empty-hint">拖拽 EPUB 文件到此处，或点击「添加书籍」</p>
        </div>
      </div>
    </main>

    <!-- 拖拽放置遮罩 -->
    <div id="drop-overlay">
      <div class="drop-hint">
        <span>📂</span>
        <p>松开添加到书架</p>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu">
      <div class="ctx-item" data-action="open">📖 阅读</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item ctx-submenu-trigger">
        📁 移动到分类
        <div id="move-to-menu" class="ctx-submenu"></div>
      </div>
      <div class="ctx-sep"></div>
      <div class="ctx-item ctx-danger" data-action="remove">🗑️ 从书架移除</div>
    </div>

    <!-- 分类命名弹窗 -->
    <div id="cat-modal" class="modal-overlay">
      <div class="modal-box">
        <h3 id="cat-modal-title">新建分类</h3>
        <input id="cat-name-input" type="text" placeholder="输入分类名称" maxlength="20" />
        <div class="modal-btns">
          <button id="cat-modal-cancel" class="btn-secondary">取消</button>
          <button id="cat-modal-confirm" class="btn-primary">确认</button>
        </div>
      </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-box confirm-modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <h3 id="confirm-modal-title">确认删除</h3>
        <p id="confirm-modal-message"></p>
        <div class="modal-btns">
          <button id="confirm-modal-cancel" class="btn-secondary">取消</button>
          <button id="confirm-modal-confirm" class="btn-primary btn-danger">删除</button>
        </div>
      </div>
    </div>

    <!-- 提示弹窗 -->
    <div id="notice-modal" class="modal-overlay">
      <div class="modal-box notice-modal-box" role="dialog" aria-modal="true" aria-labelledby="notice-modal-title">
        <h3 id="notice-modal-title">提示</h3>
        <p id="notice-modal-message"></p>
        <div class="modal-btns">
          <button id="notice-modal-confirm" class="btn-primary">知道了</button>
        </div>
      </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <p>正在处理…</p>
    </div>

    <!-- 隐藏文件输入 -->
    <input id="file-input" type="file" accept=".epub" multiple hidden />

    <script type="module" src="/src/bookshelf.js"></script>
  </body>
</html>
